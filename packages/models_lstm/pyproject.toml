[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "models-lstm"
version = "0.1.0"
description = "CLI tools for LSTM-based anomaly detection"
requires-python = ">=3.11"
authors = [{name = "session-lab", email = "devnull@example.com"}]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]

[project.scripts]
models-lstm = "models_lstm.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
