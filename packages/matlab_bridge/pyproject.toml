[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "matlab-bridge"
version = "0.1.0"
description = "CLI bridge for exporting scored data to MATLAB"
requires-python = ">=3.11"
authors = [{name = "session-lab", email = "devnull@example.com"}]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]

[project.scripts]
matlab-bridge = "matlab_bridge.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
